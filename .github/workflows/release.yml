# Builds the game for Windows, macOS (Apple Silicon + Intel) and Linux, with Java bundled in, and attaches them
# and the plain jar to a GitHub Release. Runs when you push a version tag:
#   git tag v0.0.2 && git push origin v0.0.2
# or by hand from the Actions tab (then the files are only kept as workflow artifacts, no release).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and package
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test packageApp
      - name: Plain jar (once)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cp build/libs/*-all.jar build/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: capebabe-${{ matrix.os }}
          path: build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
